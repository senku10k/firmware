[env:esp32s3-st7789]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = ${env.build_src_filter} +<../boards/esp32s3-st7789>
build_flags =
  ${env.build_flags}
  -Iboards/esp32s3-st7789
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=5
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSB_as_HID=1
  -DUSE_TFT_ESPI=1
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DST7735_DRIVER=1
  -DST7735_BLACKTAB=1
  -DTFT_INVERSION_ON=1
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=160
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=14
  -DTFT_BL=48
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_MISO=-1
  -DTOUCH_CS=-1
  -DXPT2046_SPI_BUS_MOSI_IO_NUM=11
  -DXPT2046_SPI_BUS_MISO_IO_NUM=13
  -DXPT2046_SPI_BUS_SCLK_IO_NUM=12
  -DXPT2046_SPI_CONFIG_CS_GPIO_NUM=-1
  -DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=27000000
  -DHAS_JOYSTICK=1
  -DJOY_X=1
  -DJOY_Y=2
  -DSEL_BTN=4
  -DROTATION=1
  -DINPUT_HANDLER_TASK_STACK_SIZE=8192
  -DDEVICE_NAME='"ESP32-S3 ST7735"'

lib_deps =
  ${env.lib_deps}
